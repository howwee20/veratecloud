<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="PolySwap — one workspace for every intelligence.">
  <meta name="polyswap-api" content="https://polyswap-api.polyswap.workers.dev">
  <title>PolySwap</title>
  <link rel="icon" type="image/png" href="assets/polyswap-mark.png?v=2">
  <link rel="apple-touch-icon" href="assets/polyswap-mark.png?v=2">
  <link rel="stylesheet" href="styles.css?v=local-design-15">
  <script src="app.js?v=local-design-15" defer></script>
</head>
<body>
  <header class="site-header" id="top">
    <a class="brand" href="#top" aria-label="PolySwap home">
      <span class="brand-mark" aria-hidden="true">
        <i class="brand-orb brand-orb-pink"></i>
        <i class="brand-orb brand-orb-orange"></i>
        <i class="brand-orb brand-orb-yellow"></i>
        <i class="brand-orb brand-orb-green"></i>
        <i class="brand-orb brand-orb-blue"></i>
        <i class="brand-orb brand-orb-purple"></i>
      </span>
      <span>PolySwap</span>
    </a>
  </header>

  <div class="market-ticker" id="modelTicker" aria-label="Model token prices" hidden>
    <div class="market-ticker-viewport">
      <div class="market-ticker-track" id="modelTickerTrack"></div>
    </div>
  </div>

  <main class="product-shell">
    <section class="experience" id="product" aria-label="PolySwap product">
      <div class="conversation" id="conversation" aria-live="polite"></div>

      <div class="composer-wrap" id="system">
        <form class="composer" id="composer">
          <div class="model-menu" id="modelMenu" role="dialog" aria-label="Choose a model" hidden>
            <div class="model-search-row">
              <label class="model-search">
                <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" /><path d="m13 13 4 4" /></svg>
                <input id="modelSearch" type="search" placeholder="Search models or providers" autocomplete="off">
              </label>
              <button class="model-menu-close" id="modelMenuClose" type="button" aria-label="Close model picker">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" /></svg>
              </button>
            </div>
            <div class="model-filter-bar" aria-label="Model filters">
              <button class="active" data-catalog-filter="all" type="button">Models</button>
              <button data-catalog-filter="free" type="button">Free</button>
              <button data-catalog-filter="paid" type="button">Paid</button>
            </div>
            <div class="model-options" id="modelOptions"></div>
          </div>

          <div class="composer-control-bar" role="toolbar" aria-label="Model, effort, speed, and chats">
            <button class="composer-control composer-control-model" id="modelPolicyRow" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="modelMenu">
              <span class="policy-model-mark auto-mark" aria-hidden="true"><img src="assets/polyswap-mark.png?v=2" alt=""></span>
              <span class="composer-control-copy"><small>Model</small><strong id="modelPolicyValue">Auto</strong></span>
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3" /></svg>
            </button>
            <button class="composer-control composer-control-hover-only" id="effortPolicyRow" type="button">
              <span class="composer-control-copy"><small>Effort</small><strong id="effortPolicyValue">Standard</strong></span>
            </button>
            <button class="composer-control composer-control-hover-only" id="speedPolicyRow" type="button">
              <span class="composer-control-copy"><small>Speed</small><strong id="speedPolicyValue">Standard</strong></span>
            </button>
            <button class="composer-history-button" id="historyButton" type="button" aria-label="Open chats" aria-haspopup="dialog" aria-expanded="false" aria-controls="historyDrawer" title="Chats in this browser">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5.5h12M4 10h12M4 14.5h8" /></svg>
            </button>
          </div>

          <div class="work-policy-submenu" id="effortMenu" role="menu" aria-label="Choose effort" hidden>
            <p>Effort</p>
            <button type="button" role="menuitemradio" data-effort="quick"><span><strong>Quick</strong><small>Direct response</small></span><i aria-hidden="true">✓</i></button>
            <button type="button" role="menuitemradio" data-effort="standard"><span><strong>Standard</strong><small>Balanced work</small></span><i aria-hidden="true">✓</i></button>
            <button type="button" role="menuitemradio" data-effort="deep"><span><strong>Deep</strong><small>Thorough and verified</small></span><i aria-hidden="true">✓</i></button>
          </div>

          <div class="work-policy-submenu speed-policy-menu" id="speedMenu" role="menu" aria-label="Choose speed" hidden>
            <p>Speed</p>
            <button type="button" role="menuitemradio" data-speed="standard"><span><strong>Standard</strong><small>Normal delivery</small></span><i aria-hidden="true">✓</i></button>
            <button type="button" role="menuitemradio" data-speed="fast"><span><strong>Fast</strong><small>Priority delivery</small></span><i aria-hidden="true">✓</i></button>
          </div>

          <div class="history-panel" id="historyDrawer" role="dialog" aria-label="Your chats" hidden>
            <div class="history-head">
              <div>
                <strong>Your chats</strong>
                <span>Stored in this browser</span>
              </div>
              <button id="historyCloseButton" type="button" aria-label="Close chats">×</button>
            </div>
            <button class="new-chat-button" id="newChatButton" type="button">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" /></svg>
              New chat
            </button>
            <div class="thread-list" id="threadList"></div>
          </div>

          <textarea id="prompt" rows="3" placeholder="Ask anything or describe the work" aria-label="Message PolySwap"></textarea>

          <div class="attachment-row" id="attachmentRow" hidden></div>
          <div class="composer-foot">
            <input id="fileInput" type="file" accept="image/*,.txt,.md,.json,.csv,.js,.ts,.tsx,.jsx,.py,.html,.css,.xml,.yaml,.yml" multiple hidden>
            <button class="icon-button" id="attachButton" type="button" aria-label="Add files" title="Add files">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <span class="local-state" id="localState"></span>
            <button class="submit-button" id="submitButton" type="submit" disabled aria-label="Send message">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5" /></svg>
            </button>
          </div>
        </form>

        <div class="composer-hover-preview" id="composerHoverPreview" aria-live="polite" hidden>
          <div class="composer-hover-preview-head">
            <strong id="composerHoverPreviewTitle"></strong>
            <div class="hover-model-filters" id="hoverModelFilters" aria-label="Model filters" hidden>
              <button class="active" type="button" data-hover-model-filter="all">Models</button>
              <button type="button" data-hover-model-filter="free">Free</button>
              <button type="button" data-hover-model-filter="paid">Paid</button>
            </div>
          </div>
          <div class="composer-hover-preview-wheel" id="composerHoverPreviewWheel"></div>
        </div>

        <div class="prompt-examples" id="promptExamples" aria-label="Example prompts">
          <button type="button" data-example-prompt="Summarize this PDF">Summarize this PDF</button>
          <button type="button" data-example-prompt="Write code">Write code</button>
          <button type="button" data-example-prompt="Research a company">Research a company</button>
        </div>
      </div>

      <footer class="site-footer" aria-label="Footer">
        <button type="button" data-footer-info="privacy">Privacy</button>
        <button type="button" data-footer-info="terms">Terms</button>
        <button type="button" data-footer-info="pricing">Pricing</button>
        <button type="button" data-footer-info="docs">Docs</button>
        <a href="mailto:hello@polyswap.ai">Contact</a>
      </footer>
    </section>
  </main>

  <dialog class="signin-dialog access-dialog" id="signInDialog">
    <form id="accessForm">
      <button class="dialog-close" id="accessDialogClose" type="button" aria-label="Close access dialog">×</button>
      <img src="assets/polyswap-mark.png?v=2" alt="">
      <h2>Enter invite code</h2>
      <p>Use your private invite code. Your chats stay on this browser; prompts and model responses are recorded in PolySwap's private launch log for support.</p>
      <label class="access-code-label" for="accessCodeInput">Invite code</label>
      <input class="access-code-input" id="accessCodeInput" type="password" autocomplete="one-time-code" placeholder="Enter code" required>
      <p class="access-error" id="accessError" role="alert"></p>
      <button class="dialog-primary" id="accessSubmitButton" type="submit">Continue</button>
    </form>
  </dialog>

  <dialog class="info-dialog" id="infoDialog" aria-labelledby="infoDialogTitle">
    <form method="dialog">
      <button class="dialog-close" value="close" aria-label="Close information dialog">×</button>
      <h2 id="infoDialogTitle"></h2>
      <p id="infoDialogBody"></p>
      <button class="dialog-primary" value="close">Done</button>
    </form>
  </dialog>
</body>
</html>
