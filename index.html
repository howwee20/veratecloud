<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="PolySwap — one workspace for every intelligence.">
  <title>PolySwap</title>
  <link rel="icon" type="image/png" href="assets/polyswap-mark.png?v=2">
  <link rel="apple-touch-icon" href="assets/polyswap-mark.png?v=2">
  <link rel="stylesheet" href="styles.css?v=bottom-rail-1">
  <script src="app.js?v=bottom-rail-1" defer></script>
</head>
<body>
  <header class="site-header" id="top">
    <a class="brand" href="#top" aria-label="PolySwap home">
      <img src="assets/polyswap-mark.png?v=2" alt="">
      <span>PolySwap</span>
    </a>
  </header>

  <main class="product-shell">
    <section class="experience" id="product" aria-label="PolySwap product">
      <div class="conversation" id="conversation" aria-live="polite"></div>

      <div class="composer-wrap" id="system">
        <form class="composer" id="composer">
          <div class="policy-bar" aria-label="Task policy">
            <button class="policy-button primary-policy" id="modelButton" type="button" aria-expanded="false">
              <span class="provider-mark auto-mark">A</span>
              <span id="selectedModelLabel">Auto</span>
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3" /></svg>
            </button>
            <button class="policy-button" id="economyButton" type="button">
              <span id="economyLabel">Economy</span>
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3" /></svg>
            </button>
            <button class="policy-button" id="capButton" type="button">
              <span id="capLabel">$0.20 target</span>
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3" /></svg>
            </button>
            <span class="policy-separator">·</span>
            <button class="policy-button" id="speedButton" type="button">
              <span id="speedLabel">Flexible</span>
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3" /></svg>
            </button>
            <span class="policy-separator">·</span>
            <button class="policy-button" id="proofButton" type="button">
              <span id="proofLabel">Standard</span>
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3" /></svg>
            </button>
          </div>

          <div class="model-menu" id="modelMenu" hidden>
            <label class="model-search">
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" /><path d="m13 13 4 4" /></svg>
              <input id="modelSearch" type="search" placeholder="Search hundreds of models" autocomplete="off">
            </label>
            <div class="model-filter-bar" aria-label="Model filters">
              <button class="active" data-catalog-filter="all" type="button">All</button>
              <button data-catalog-filter="agent" type="button">Agent capable</button>
              <button data-catalog-filter="free" type="button">Free</button>
              <button data-catalog-filter="favorites" type="button">Favorites</button>
              <button data-catalog-filter="recent" type="button">Recent</button>
              <span id="catalogStats">Loading live catalog…</span>
            </div>
            <div class="model-advanced-filters">
              <label>Provider<select id="providerFilter"><option value="all">Any provider</option></select></label>
              <label>Context<select id="contextFilter"><option value="0">Any context</option><option value="32768">32K+</option><option value="131072">128K+</option><option value="1000000">1M+</option></select></label>
              <label>Input<select id="modalityFilter"><option value="all">Text</option><option value="vision">Vision</option></select></label>
            </div>
            <div class="model-options" id="modelOptions"></div>
          </div>

          <textarea id="prompt" rows="3" placeholder="Ask anything or describe the work" aria-label="Message PolySwap"></textarea>

          <div class="attachment-row" id="attachmentRow" hidden></div>
          <div class="composer-foot">
            <input id="fileInput" type="file" accept="image/*,.txt,.md,.json,.csv,.js,.ts,.tsx,.jsx,.py,.html,.css,.xml,.yaml,.yml" multiple hidden>
            <button class="icon-button" id="attachButton" type="button" aria-label="Add files" title="Add files">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <span class="local-state" id="localState">Loading live model catalog…</span>
            <button class="submit-button" id="submitButton" type="submit" disabled aria-label="Send message">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5" /></svg>
            </button>
          </div>
        </form>
      </div>
    </section>

    <section class="model-rail" aria-label="Available intelligence models">
      <div class="model-viewport">
        <div class="model-track" id="modelTrack"></div>
      </div>
    </section>
  </main>
</body>
</html>
