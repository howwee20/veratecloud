<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="PolySwap — one workspace for every intelligence.">
  <meta name="polyswap-api" content="https://polyswap-api.polyswap.workers.dev">
  <title>PolySwap</title>
  <link rel="icon" type="image/png" href="assets/polyswap-mark.png?v=2">
  <link rel="apple-touch-icon" href="assets/polyswap-mark.png?v=2">
  <link rel="stylesheet" href="styles.css?v=product-home-2">
  <script src="app.js?v=product-home-2" defer></script>
</head>
<body>
  <header class="site-header" id="top">
    <a class="brand" href="#top" aria-label="PolySwap home">
      <img src="assets/polyswap-mark.png?v=2" alt="">
      <span>PolySwap</span>
    </a>
    <button class="signin-button" id="signInButton" type="button">Sign in</button>
  </header>

  <main class="product-shell">
    <section class="experience" id="product" aria-label="PolySwap product">
      <div class="conversation" id="conversation" aria-live="polite"></div>

      <div class="composer-wrap" id="system">
        <form class="composer" id="composer">
          <div class="policy-bar" aria-label="Task policy">
            <button class="policy-button primary-policy" id="modelButton" type="button" aria-expanded="false" aria-controls="modelMenu" aria-label="Choose a model. Auto selected.">
              <span class="provider-mark auto-mark"><img src="assets/polyswap-mark.png?v=2" alt=""></span>
              <span id="selectedModelLabel">Auto</span>
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3" /></svg>
            </button>
          </div>

          <div class="model-menu" id="modelMenu" role="dialog" aria-label="Choose a model" hidden>
            <label class="model-search">
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" /><path d="m13 13 4 4" /></svg>
              <input id="modelSearch" type="search" placeholder="Search models or providers" autocomplete="off">
            </label>
            <div class="model-filter-bar" aria-label="Model filters">
              <button class="active" data-catalog-filter="all" type="button">All models</button>
              <button data-catalog-filter="agent" type="button">Agent ready</button>
              <button data-catalog-filter="free" type="button">Free</button>
              <button data-catalog-filter="favorites" type="button">Favorites</button>
              <button data-catalog-filter="recent" type="button">Recent</button>
            </div>
            <div class="model-advanced-filters">
              <label>Provider<select id="providerFilter"><option value="all">Any provider</option></select></label>
              <label>Context window<select id="contextFilter"><option value="0">Any size</option><option value="32768">32K+</option><option value="131072">128K+</option><option value="1000000">1M+</option></select></label>
              <label>Input<select id="modalityFilter"><option value="all">Any input</option><option value="vision">Vision</option></select></label>
            </div>
            <div class="model-options" id="modelOptions"></div>
          </div>

          <textarea id="prompt" rows="3" placeholder="Ask anything or describe the work" aria-label="Message PolySwap"></textarea>

          <div class="attachment-row" id="attachmentRow" hidden></div>
          <div class="composer-foot">
            <input id="fileInput" type="file" accept="image/*,.txt,.md,.json,.csv,.js,.ts,.tsx,.jsx,.py,.html,.css,.xml,.yaml,.yml" multiple hidden>
            <button class="icon-button" id="attachButton" type="button" aria-label="Add files" title="Add files">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <span class="local-state" id="localState"></span>
            <button class="submit-button" id="submitButton" type="submit" disabled aria-label="Send message">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5" /></svg>
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <dialog class="signin-dialog" id="signInDialog">
    <form method="dialog">
      <button class="dialog-close" value="close" aria-label="Close sign in dialog">×</button>
      <img src="assets/polyswap-mark.png?v=2" alt="">
      <h2>Keep your work</h2>
      <p>Accounts are coming next. For now, you can use PolySwap without signing in and your work stays in this browser.</p>
      <button class="dialog-primary" value="close">Continue anonymously</button>
    </form>
  </dialog>
</body>
</html>
