<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="polyswap-api" content="https://polyswap-api.polyswap.workers.dev">
  <meta name="description" content="Send durable PolySwap agents from your phone and follow the work from anywhere.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PolySwap">
  <title>PolySwap Mobile</title>
  <link rel="icon" type="image/png" href="assets/polyswap-mark.png?v=2">
  <link rel="apple-touch-icon" href="assets/polyswap-mark.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="mobile.css?v=mobile-cloud-4">
  <script src="mobile.js?v=mobile-cloud-4" defer></script>
</head>
<body>
  <header class="mobile-header">
    <a class="mobile-brand" href="mobile.html" aria-label="PolySwap tasks">
      <img src="assets/polyswap-mark.png?v=2" alt="">
      <span>PolySwap</span>
    </a>
  </header>

  <main class="mobile-main">
    <section class="tasks-section" aria-labelledby="tasksTitle">
      <div class="task-tabs" role="tablist" aria-label="Task filters">
        <button class="active" type="button" role="tab" aria-selected="true" data-filter="active">Tasks</button>
        <button type="button" role="tab" aria-selected="false" data-filter="attention">Needs you <span id="attentionCount" hidden>0</span></button>
        <button type="button" role="tab" aria-selected="false" data-filter="archive">Archive</button>
        <button class="task-search" id="searchButton" type="button" aria-label="Search tasks">⌕</button>
      </div>
      <h2 class="sr-only" id="tasksTitle">PolySwap tasks</h2>
      <div class="status-banner" id="statusBanner" hidden></div>
      <div class="notification-prompt" id="notificationPrompt" hidden>
        <span>Get updates when jobs finish</span>
        <button id="notificationButton" type="button">Turn on</button>
      </div>
      <div class="task-list" id="taskList" aria-live="polite"></div>
    </section>

    <form class="job-composer" id="jobComposer">
      <label class="sr-only" for="jobPrompt">Ask anything or describe the work</label>
      <textarea id="jobPrompt" rows="1" maxlength="8000" placeholder="Ask anything or describe the work" required></textarea>
      <div class="composer-bottom">
        <button class="composer-tool model-tool" id="modelButton" type="button" aria-haspopup="dialog">
          <img id="modelIcon" src="assets/polyswap-mark.png?v=2" alt="">
          <b id="modelLabel">Auto</b><span aria-hidden="true">⌄</span>
        </button>
        <div class="send-tools">
          <button class="voice-button" id="voiceButton" type="button" aria-label="Dictate the job">⌁</button>
          <button class="send-button" id="sendButton" type="submit" aria-label="Send job to PolySwap">↑</button>
        </div>
      </div>
    </form>
  </main>

  <dialog class="sheet-dialog access-dialog" id="accessDialog">
    <form method="dialog" class="sheet-card" id="accessForm">
      <button class="sheet-close" value="cancel" aria-label="Close">×</button>
      <img class="sheet-mark" src="assets/polyswap-mark.png?v=2" alt="">
      <p class="sheet-kicker">Private alpha</p>
      <h2>Open your PolySwap</h2>
      <p>Enter your access code.</p>
      <label for="accessCode">Access code</label>
      <input id="accessCode" type="password" autocomplete="one-time-code" placeholder="Enter code">
      <p class="form-error" id="accessError" hidden></p>
      <button class="primary-action" id="accessSubmit" value="default">Continue</button>
      <button class="quiet-action" id="demoButton" type="button">Preview the phone experience</button>
    </form>
  </dialog>

  <dialog class="sheet-dialog model-dialog" id="modelDialog">
    <div class="sheet-card">
      <button class="sheet-close" id="modelClose" type="button" aria-label="Close">×</button>
      <p class="sheet-kicker">Model</p>
      <h2>Pick a model</h2>
      <p class="model-intro">Change the model. Keep the same job.</p>
      <div class="model-options" id="modelOptions"></div>
    </div>
  </dialog>

  <dialog class="task-dialog" id="taskDialog">
    <article class="task-detail">
      <header>
        <button class="task-back" id="taskClose" type="button" aria-label="Close task">‹</button>
        <div><small id="taskDetailId">Job</small><strong id="taskDetailStatus">Queued</strong></div>
      </header>
      <section class="task-detail-main">
        <h2 id="taskDetailTitle">PolySwap job</h2>
        <p id="taskDetailGoal"></p>
        <section class="approval-card" id="approvalCard" hidden>
          <small>PolySwap needs you</small>
          <h3 id="approvalTitle">Allow this action?</h3>
          <p id="approvalDescription"></p>
          <code id="approvalResource"></code>
          <div><button class="quiet-action" id="denyButton" type="button">Deny</button><button class="primary-action" id="approveButton" type="button">Allow once</button></div>
        </section>
        <section class="receipt-card" id="receiptCard" hidden>
          <small>Result</small>
          <h3 id="receiptTitle">Completed</h3>
          <p id="receiptSummary"></p>
          <ul id="receiptEvidence"></ul>
        </section>
        <section class="timeline-section">
          <h3>Activity</h3>
          <div class="timeline" id="taskTimeline"></div>
        </section>
      </section>
      <footer class="task-actions" id="taskActions">
        <button id="swapButton" type="button">Swap intelligence</button>
        <button id="pauseButton" type="button">Pause</button>
        <button class="danger-action" id="cancelButton" type="button">Cancel</button>
      </footer>
    </article>
  </dialog>

  <template id="taskTemplate">
    <button class="task-row" type="button">
      <span class="task-state"><i></i></span>
      <span class="task-copy"><strong></strong><small></small></span>
      <span class="task-meta"><em></em><time></time></span>
    </button>
  </template>
</body>
</html>
