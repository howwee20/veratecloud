<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="polyswap-api" content="https://polyswap-api.polyswap.workers.dev">
  <title>PolySwap Operator</title>
  <link rel="icon" type="image/png" href="assets/polyswap-mark.png?v=2">
  <link rel="stylesheet" href="styles.css?v=friends-alpha-1">
  <style>
    body { height:auto; min-height:100%; overflow:auto; background:#f8f8f9; }
    .operator-shell { width:min(1100px,calc(100% - 32px)); margin:0 auto; padding:40px 0 80px; }
    .operator-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; }
    .operator-head h1 { margin:0; font-size:25px; letter-spacing:-.045em; }
    .operator-head p { margin:6px 0 0; color:#85858f; font-size:12px; }
    .operator-auth,.operator-actions { display:flex; gap:8px; }
    .operator-auth input { width:260px; height:42px; padding:0 13px; border:1px solid #dcdce2; border-radius:11px; outline:0; background:#fff; font:inherit; font-size:12px; }
    .operator-auth input:focus { border-color:#aba4d5; box-shadow:0 0 0 3px rgba(109,60,243,.08); }
    .operator-button { height:42px; padding:0 16px; border:1px solid #dcdce2; border-radius:11px; background:#fff; color:#38383f; font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
    .operator-button.primary { border-color:#222227; background:#222227; color:#fff; }
    .operator-button.danger { border-color:#e6c8c4; color:#a34537; }
    .operator-button:disabled { opacity:.45; cursor:default; }
    .operator-error { margin:0 0 16px; padding:12px 14px; border:1px solid #efd0cc; border-radius:11px; background:#fff7f5; color:#9a4034; font-size:12px; }
    .operator-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:20px; }
    .metric { min-height:90px; padding:17px 18px; border:1px solid #e2e2e7; border-radius:15px; background:#fff; box-shadow:0 8px 26px rgba(28,28,38,.025); }
    .metric span { display:block; color:#93939d; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
    .metric strong { display:block; margin-top:10px; color:#27272d; font-size:22px; letter-spacing:-.04em; }
    .metric strong.good { color:#247052; }
    .metric strong.paused { color:#a34537; }
    .operator-section { margin-top:16px; border:1px solid #e2e2e7; border-radius:16px; background:#fff; overflow:hidden; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; border-bottom:1px solid #ececf0; }
    .section-head h2 { margin:0; font-size:14px; letter-spacing:-.02em; }
    .section-head span { color:#9999a2; font-size:10px; }
    .model-table { width:100%; border-collapse:collapse; }
    .model-table th,.model-table td { padding:12px 18px; border-bottom:1px solid #f0f0f2; text-align:left; font-size:11px; }
    .model-table th { color:#9999a2; font-size:9px; letter-spacing:.05em; text-transform:uppercase; }
    .model-table tr:last-child td { border-bottom:0; }
    .operator-messages { display:grid; }
    .operator-message { padding:15px 18px; border-bottom:1px solid #efeff2; }
    .operator-message:last-child { border-bottom:0; }
    .operator-meta { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; color:#9999a2; font-size:9px; }
    .operator-role { color:#34343b; font-weight:800; text-transform:uppercase; }
    .operator-content { margin:0; color:#4f4f58; font-size:12px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
    .operator-empty { padding:46px 20px; color:#9a9aa3; font-size:12px; text-align:center; }
    [hidden] { display:none !important; }
    @media (max-width:800px) { .operator-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:650px) { .operator-head { align-items:stretch; flex-direction:column; } .operator-auth { flex-wrap:wrap; } .operator-auth input { min-width:0; width:100%; } .operator-actions { width:100%; } .operator-actions .operator-button { flex:1; } .model-table th,.model-table td { padding:11px 12px; } }
  </style>
</head>
<body>
  <header class="site-header"><a class="brand" href="/" aria-label="PolySwap home"><img src="assets/polyswap-mark.png?v=2" alt=""><span>PolySwap</span></a></header>
  <main class="operator-shell">
    <div class="operator-head">
      <div><h1>Friends alpha</h1><p>Private launch activity, shared spend, and the emergency stop.</p></div>
      <form class="operator-auth" id="operatorAuth"><input id="operatorToken" type="password" placeholder="Private operator token" autocomplete="current-password"><button class="operator-button primary">Open</button></form>
      <div class="operator-actions" id="operatorActions" hidden><button class="operator-button" id="refreshButton" type="button">Refresh</button><button class="operator-button danger" id="pauseButton" type="button">Pause requests</button></div>
    </div>
    <p class="operator-error" id="operatorError" hidden></p>
    <section class="operator-grid" id="operatorGrid" hidden>
      <div class="metric"><span>Remaining</span><strong id="remainingValue">$10.00</strong></div>
      <div class="metric"><span>Spent</span><strong id="spentValue">$0.00</strong></div>
      <div class="metric"><span>Requests</span><strong id="requestsValue">0</strong></div>
      <div class="metric"><span>Status</span><strong class="good" id="statusValue">Running</strong></div>
    </section>
    <section class="operator-section" id="modelSection" hidden>
      <div class="section-head"><h2>Model usage</h2><span id="sessionValue"></span></div>
      <table class="model-table"><thead><tr><th>Model</th><th>Requests</th><th>Cost</th></tr></thead><tbody id="modelRows"></tbody></table>
    </section>
    <section class="operator-section"><div class="section-head"><h2>Launch log</h2><span>Latest 250 messages</span></div><div class="operator-messages" id="operatorMessages"><p class="operator-empty">Enter the private operator token.</p></div></section>
  </main>
  <script>
    const apiRoot = document.querySelector('meta[name="polyswap-api"]').content.replace(/\/$/, '')
    const $ = selector => document.querySelector(selector)
    const auth = $('#operatorAuth'), tokenInput = $('#operatorToken'), actions = $('#operatorActions'), errorBox = $('#operatorError'), grid = $('#operatorGrid'), modelSection = $('#modelSection'), modelRows = $('#modelRows'), messages = $('#operatorMessages'), pauseButton = $('#pauseButton')
    let snapshot = null
    tokenInput.value = sessionStorage.getItem('polyswap-operator-token') || ''
    const money = value => `$${Number(value || 0).toFixed(4)}`
    const operatorHeaders = () => ({ Authorization: `Bearer ${tokenInput.value.trim()}` })
    function showError(message = '') { errorBox.hidden = !message; errorBox.textContent = message }
    function render(payload) {
      snapshot = payload
      const spent = Number(payload.budget?.spent_usd || 0), reserved = Number(payload.budget?.reserved_usd || 0), paused = Boolean(payload.runtime?.paused)
      $('#remainingValue').textContent = money(Math.max(0, 10 - spent - reserved)); $('#spentValue').textContent = money(spent); $('#requestsValue').textContent = String(payload.counts?.requests || 0)
      $('#statusValue').textContent = paused ? 'Paused' : 'Running'; $('#statusValue').className = paused ? 'paused' : 'good'
      $('#sessionValue').textContent = `${payload.counts?.sessions || 0} browser${Number(payload.counts?.sessions || 0) === 1 ? '' : 's'} · ${payload.counts?.failed || 0} failed`
      pauseButton.textContent = paused ? 'Resume requests' : 'Pause requests'; pauseButton.classList.toggle('danger', !paused)
      grid.hidden = false; actions.hidden = false; auth.hidden = true
      modelRows.replaceChildren(); const models = payload.models || []; modelSection.hidden = !models.length
      models.forEach(item => { const row = document.createElement('tr'); [item.model || 'Unknown', item.requests || 0, money(item.cost_usd)].forEach(value => { const cell = document.createElement('td'); cell.textContent = value; row.appendChild(cell) }); modelRows.appendChild(row) })
      messages.replaceChildren()
      if (!payload.messages?.length) { messages.innerHTML = '<p class="operator-empty">No prompts have been sent yet.</p>'; return }
      payload.messages.forEach(item => {
        const article = document.createElement('article'); article.className = 'operator-message'; const meta = document.createElement('div'); meta.className = 'operator-meta'
        ;[item.role,item.model,item.session_id,item.created_at,item.cost_usd == null ? null : money(item.cost_usd)].filter(Boolean).forEach((value,index) => { const span = document.createElement('span'); span.textContent = value; if (index === 0) span.className = 'operator-role'; meta.appendChild(span) })
        const content = document.createElement('p'); content.className = 'operator-content'; content.textContent = item.content; article.append(meta,content); messages.appendChild(article)
      })
    }
    async function loadOperator() {
      const token = tokenInput.value.trim(); if (!token) return; sessionStorage.setItem('polyswap-operator-token', token); showError(); messages.innerHTML = '<p class="operator-empty">Loading…</p>'
      const response = await fetch(`${apiRoot}/v1/admin/overview`, { headers: operatorHeaders() }); const payload = await response.json().catch(() => ({}))
      if (!response.ok) throw new Error(payload.error?.message || `Request returned ${response.status}`); render(payload)
    }
    async function setPaused(paused) {
      pauseButton.disabled = true; showError()
      try { const response = await fetch(`${apiRoot}/v1/admin/state`, { method:'POST', headers:{ ...operatorHeaders(), 'Content-Type':'application/json' }, body:JSON.stringify({ paused }) }); const payload = await response.json().catch(() => ({})); if (!response.ok) throw new Error(payload.error?.message || `Request returned ${response.status}`); await loadOperator() } finally { pauseButton.disabled = false }
    }
    auth.addEventListener('submit', event => { event.preventDefault(); loadOperator().catch(error => { showError(error.message); messages.innerHTML = '<p class="operator-empty">Could not open the operator view.</p>' }) })
    $('#refreshButton').addEventListener('click', () => loadOperator().catch(error => showError(error.message)))
    pauseButton.addEventListener('click', () => setPaused(!snapshot?.runtime?.paused).catch(error => showError(error.message)))
    if (tokenInput.value) loadOperator().catch(() => sessionStorage.removeItem('polyswap-operator-token'))
  </script>
</body>
</html>
