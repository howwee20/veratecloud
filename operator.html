<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="polyswap-api" content="https://polyswap-api.polyswap.workers.dev">
  <title>PolySwap Operator</title>
  <link rel="icon" type="image/png" href="assets/polyswap-mark.png?v=2">
  <link rel="stylesheet" href="styles.css?v=product-home-1">
  <style>
    body { height: auto; min-height: 100%; overflow: auto; background: #fafafa; }
    .operator-shell { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 44px 0 80px; }
    .operator-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .operator-head h1 { margin: 0; font-size: 22px; letter-spacing: -.045em; }
    .operator-head p { margin: 6px 0 0; color: #85858f; font-size: 10px; }
    .operator-auth { display: flex; gap: 8px; }
    .operator-auth input { width: 250px; height: 38px; padding: 0 12px; border: 1px solid #dcdce2; border-radius: 9px; outline: 0; background: #fff; font-size: 10px; }
    .operator-auth button { height: 38px; padding: 0 15px; border: 0; border-radius: 9px; background: #222227; color: #fff; font-size: 10px; cursor: pointer; }
    .budget-card { display: flex; align-items: baseline; gap: 10px; padding: 18px 20px; border: 1px solid #e2e2e7; border-radius: 14px; background: #fff; }
    .budget-card strong { font-size: 21px; letter-spacing: -.04em; }
    .budget-card span { color: #8b8b94; font-size: 9px; }
    .operator-messages { display: grid; gap: 10px; margin-top: 16px; }
    .operator-message { padding: 15px 17px; border: 1px solid #e5e5e9; border-radius: 13px; background: #fff; }
    .operator-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 9px; color: #9999a2; font-size: 8px; }
    .operator-role { color: #34343b; font-weight: 760; text-transform: uppercase; }
    .operator-content { margin: 0; color: #4f4f58; font-size: 11px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .operator-empty { padding: 50px 0; color: #9a9aa3; font-size: 11px; text-align: center; }
    @media (max-width: 650px) { .operator-head { align-items: stretch; flex-direction: column; } .operator-auth input { min-width: 0; width: 100%; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="PolySwap home"><img src="assets/polyswap-mark.png?v=2" alt=""><span>PolySwap</span></a>
  </header>
  <main class="operator-shell">
    <div class="operator-head">
      <div><h1>Operator</h1><p>Private launch activity and metered usage.</p></div>
      <form class="operator-auth" id="operatorAuth"><input id="operatorToken" type="password" placeholder="Admin token" autocomplete="current-password"><button>Open</button></form>
    </div>
    <div class="budget-card" id="budgetCard" hidden><strong id="budgetValue">$0.00</strong><span>spent from the $10 launch pool</span></div>
    <section class="operator-messages" id="operatorMessages"><p class="operator-empty">Enter the private operator token.</p></section>
  </main>
  <script>
    const apiRoot = document.querySelector('meta[name="polyswap-api"]').content.replace(/\/$/, '')
    const auth = document.querySelector('#operatorAuth')
    const tokenInput = document.querySelector('#operatorToken')
    const messages = document.querySelector('#operatorMessages')
    const budgetCard = document.querySelector('#budgetCard')
    const budgetValue = document.querySelector('#budgetValue')
    tokenInput.value = sessionStorage.getItem('polyswap-operator-token') || ''
    async function loadOperator() {
      const token = tokenInput.value.trim()
      if (!token) return
      sessionStorage.setItem('polyswap-operator-token', token)
      messages.innerHTML = '<p class="operator-empty">Loading…</p>'
      const response = await fetch(`${apiRoot}/v1/admin/messages`, { headers: { Authorization: `Bearer ${token}` } })
      const payload = await response.json().catch(() => ({}))
      if (!response.ok) throw new Error(payload.error?.message || `Request returned ${response.status}`)
      budgetCard.hidden = false
      budgetValue.textContent = `$${Number(payload.budget?.spent_usd || 0).toFixed(4)}`
      messages.replaceChildren()
      if (!payload.messages?.length) {
        messages.innerHTML = '<p class="operator-empty">No prompts have been sent yet.</p>'
        return
      }
      payload.messages.forEach(item => {
        const article = document.createElement('article')
        article.className = 'operator-message'
        const meta = document.createElement('div')
        meta.className = 'operator-meta'
        ;[item.role, item.model, item.session_id, item.created_at, item.cost_usd == null ? null : `$${Number(item.cost_usd).toFixed(5)}`].filter(Boolean).forEach((value, index) => {
          const span = document.createElement('span')
          span.textContent = value
          if (index === 0) span.className = 'operator-role'
          meta.appendChild(span)
        })
        const content = document.createElement('p')
        content.className = 'operator-content'
        content.textContent = item.content
        article.append(meta, content)
        messages.appendChild(article)
      })
    }
    auth.addEventListener('submit', event => {
      event.preventDefault()
      loadOperator().catch(error => { messages.innerHTML = `<p class="operator-empty"></p>`; messages.firstChild.textContent = error.message })
    })
    if (tokenInput.value) loadOperator().catch(() => sessionStorage.removeItem('polyswap-operator-token'))
  </script>
</body>
</html>
